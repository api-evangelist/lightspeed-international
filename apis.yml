name: Lightspeed International
description: 'Lightspeed International Inc. was a software company founded in 1995 that developed
  voice control software for data communications networks, an early entrant in the mid-1990s effort to
  carry voice traffic over packet-switched data infrastructure. It was co-founded and led by CEO Lev
  Volftsun and backed at the early stage by Lightspeed Venture Partners. Cisco Systems, Inc. acquired
  the company in 1997, absorbing its voice-over-data-networks technology and team. The company has not
  operated as an independent entity since that acquisition, predates the public web API era entirely,
  and never published an API, developer portal, SDK, or machine-readable interface. Its legacy domain
  lightspeedinternational.com is now a parked HugeDomains for-sale listing with no live web surface.
  This profile is retained as a historical record of the Lightspeed Venture Partners portfolio and is
  not an active API provider. NOTE: unrelated to Lightspeed Commerce (the retail and restaurant POS
  company profiled at all/lightspeed and all/lightspeed-pos), to Lightspeed Trading at lightspeed.com,
  and — despite the shared name — a portfolio company of rather than an affiliate of Lightspeed
  Venture Partners (see x-disambiguation).'
